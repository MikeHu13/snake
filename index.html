<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Snake – das klassische Spiel im Browser" />
    <title>Snake</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0f14'/><path d='M8 22V12h10v8' stroke='%2334e89e' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='24' cy='10' r='3' fill='%23ff4d6d'/></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="stat">
          <span class="stat-label">Punkte</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <h1 class="title">Snake</h1>
        <div class="stat stat-right">
          <span class="stat-label">Rekord</span>
          <span class="stat-value" id="best">0</span>
        </div>
      </header>

      <div class="board" id="board">
        <canvas id="canvas" aria-label="Spielfeld"></canvas>

        <div class="overlay" id="overlay">
          <p class="overlay-title" id="overlay-title">Snake</p>
          <p class="overlay-text" id="overlay-text"></p>
          <button class="btn" id="overlay-button" type="button">Start</button>
        </div>

        <button class="pause-btn" id="pause" type="button" aria-label="Pause" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="5" width="4" height="14" rx="1.5" />
            <rect x="14" y="5" width="4" height="14" rx="1.5" />
          </svg>
        </button>
      </div>

      <p class="hint" id="hint"></p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
